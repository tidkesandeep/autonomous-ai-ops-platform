name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyspark

      - name: Ruff
        run: ruff check src tests

      - name: Pytest
        run: pytest -q
        env:
          # Local Spark; Databricks tables are mocked / skipped when unavailable
          SPARK_LOCAL_IP: 127.0.0.1
