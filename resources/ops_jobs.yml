# Phase 2 ops observability jobs

resources:
  jobs:
    ops_telemetry_dq:
      name: ops-telemetry-dq
      max_concurrent_runs: 1
      timeout_seconds: 1800
      tasks:
        - task_key: telemetry_and_dq
          notebook_task:
            notebook_path: ../notebooks/ops/01_ops_telemetry_and_dq.py
            base_parameters:
              pipeline_key: orders_ingest

    ops_jobs_api_poller:
      name: ops-jobs-api-poller
      max_concurrent_runs: 1
      timeout_seconds: 1800
      schedule:
        quartz_cron_expression: "0 */15 * * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
        - task_key: ingest_failed_task_logs
          notebook_task:
            notebook_path: ../notebooks/ops/02_jobs_api_poller.py
            base_parameters:
              lookback_hours: "24"
