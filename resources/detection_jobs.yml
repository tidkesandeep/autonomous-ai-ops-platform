# Phase 3 incident detection + chaos jobs

resources:
  jobs:
    ops_incident_detection:
      name: ops-incident-detection
      max_concurrent_runs: 1
      timeout_seconds: 1800
      schedule:
        quartz_cron_expression: "0 */10 * * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      email_notifications:
        on_failure:
          - sandeeptidke.work@gmail.com
      tasks:
        - task_key: detect_and_open_incidents
          max_retries: 1
          notebook_task:
            notebook_path: ../notebooks/ops/03_incident_detection.py
            base_parameters:
              lookback_hours: "24"

    ops_chaos_inject:
      name: ops-chaos-inject
      max_concurrent_runs: 1
      timeout_seconds: 1800
      tasks:
        - task_key: inject_failure
          max_retries: 0
          notebook_task:
            notebook_path: ../notebooks/ops/04_chaos_inject.py
            base_parameters:
              failure_type: null_spike

    ops_reset_demo:
      name: ops-reset-demo
      max_concurrent_runs: 1
      timeout_seconds: 3600
      tasks:
        - task_key: reset_demo
          max_retries: 1
          notebook_task:
            notebook_path: ../notebooks/ops/05_reset_demo.py
            base_parameters:
              seed: "42"
              reset_lakebase: "true"

    ops_phase3_prove:
      name: ops-phase3-prove
      max_concurrent_runs: 1
      timeout_seconds: 7200
      tasks:
        - task_key: prove_six_classes
          max_retries: 0
          notebook_task:
            notebook_path: ../notebooks/ops/06_phase3_prove.py
            base_parameters:
              checks_path: /Workspace/Users/sandeeptidke.work@gmail.com/autonomous-ai-ops-platform/config/dq_checks.yml

    ops_seed_console:
      name: ops-seed-console
      max_concurrent_runs: 1
      timeout_seconds: 10800
      tasks:
        - task_key: seed_all_classes
          max_retries: 0
          notebook_task:
            notebook_path: ../notebooks/ops/14_seed_console.py
            base_parameters:
              clear_existing: "false"
              run_agent: "true"
              approve_diagnosis_only: "true"
              checks_path: /Workspace/Users/sandeeptidke.work@gmail.com/autonomous-ai-ops-platform/config/dq_checks.yml
