# Phase 5 remediation + analytics sync jobs

resources:
  jobs:
    ops_remediate:
      name: ops-remediate
      max_concurrent_runs: 2
      timeout_seconds: 1800
      email_notifications:
        on_failure:
          - sandeeptidke.work@gmail.com
      tasks:
        - task_key: remediate
          # Empty-param Run Now fails deterministically; retries only amplify
          # serverless REPL restart noise in driver Log4j.
          max_retries: 0
          notebook_task:
            notebook_path: ../notebooks/ops/10_remediate.py
            base_parameters:
              incident_id: ""
              remediation_type: ""
              parameters_json: "{}"

    ops_sync_analytics:
      name: ops-sync-analytics
      max_concurrent_runs: 1
      timeout_seconds: 1800
      schedule:
        quartz_cron_expression: "0 */15 * * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
        - task_key: sync_mirrors
          max_retries: 1
          notebook_task:
            notebook_path: ../notebooks/ops/11_sync_analytics.py

    ops_phase5_prove:
      name: ops-phase5-prove
      max_concurrent_runs: 1
      timeout_seconds: 7200
      tasks:
        - task_key: prove_full_loop
          max_retries: 0
          notebook_task:
            notebook_path: ../notebooks/ops/12_phase5_prove.py
            base_parameters:
              failure_type: null_spike
              use_chaos: "true"
