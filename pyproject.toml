[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-ai-ops-platform"
version = "0.1.0"
description = "Autonomous AI investigation of Databricks pipeline failures"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "faker>=24.0.0",
  "PyYAML>=6.0",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.4.0", "sqlfluff>=3.0.0"]
agent = ["litellm>=1.40.0", "langgraph>=0.2.0", "langchain-core>=0.3.0", "PyGithub>=2.3.0"]
app = ["streamlit>=1.32.0", "psycopg[binary]>=3.1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
