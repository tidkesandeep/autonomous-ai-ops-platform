# Databricks Asset Bundle — Autonomous AI Ops Platform
# Docs: https://docs.databricks.com/dev-tools/bundles/index.html

bundle:
  name: autonomous-ai-ops-platform

variables:
  demo_catalog:
    description: Unity Catalog catalog for monitored e-commerce data
    default: demo
  ops_catalog:
    description: Unity Catalog catalog for ops telemetry + synced analytics
    default: ops

include:
  - resources/*.yml

# Sync application + notebook sources into the bundle workspace root so job
# notebooks can import `src.*` and read config/runbooks relative to ROOT.
sync:
  include:
    - notebooks/**
    - src/**
    - config/**
    - docs/runbooks/**
    - docs/metrics/**
    - app/**
    - resources/lakebase_schema.sql
    - requirements.txt

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-da72c144-83db.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    workspace:
      host: https://dbc-da72c144-83db.cloud.databricks.com
      # Free Edition: deploy under the operator home rather than /Shared
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - level: CAN_MANAGE
        user_name: ${workspace.current_user.userName}
